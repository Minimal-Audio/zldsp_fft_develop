name: FFT Commit Comparison

on:
  workflow_dispatch:
    inputs:
      n0:
        description: First FFT order
        required: true
        default: "5"
        type: string
      n1:
        description: Last FFT order
        required: true
        default: "25"
        type: string
      repeats:
        description: Number of comparison repetitions
        required: true
        default: "6"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build_and_test:
    name: ${{ matrix.name }} ${{ matrix.fft }} Comparison
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        fft: [cfft, rfft]
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            arch: x86-64
          - name: Linux arm64
            os: ubuntu-26.04-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Show CPU Info
        if: runner.os == 'Linux'
        run: lscpu

      - name: FFT Comparison AVX2 Double
        if: matrix.arch == 'x86-64'
        shell: bash
        run: |
          python -u benchmark/run.py compare ${{ matrix.fft }} "${{ inputs.n0 }}" "${{ inputs.n1 }}" --repeats "${{ inputs.repeats }}" --avx2 --double

      - name: FFT Comparison AVX2
        if: matrix.arch == 'x86-64'
        shell: bash
        run: |
          python -u benchmark/run.py compare ${{ matrix.fft }} "${{ inputs.n0 }}" "${{ inputs.n1 }}" --repeats "${{ inputs.repeats }}" --avx2

      - name: FFT Comparison Double
        shell: bash
        run: |
          python -u benchmark/run.py compare ${{ matrix.fft }} "${{ inputs.n0 }}" "${{ inputs.n1 }}" --repeats "${{ inputs.repeats }}" --double

      - name: FFT Comparison
        shell: bash
        run: |
          python -u benchmark/run.py compare ${{ matrix.fft }} "${{ inputs.n0 }}" "${{ inputs.n1 }}" --repeats "${{ inputs.repeats }}"
